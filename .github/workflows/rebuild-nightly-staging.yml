name: rebuild-nightly-staging

# Daily 03:00 UTC safety-net rebuild of dev → staging. Mirrors
# rebuild-nightly.yml (prod equivalent) so staging picks up fresh
# VERIFIER_LAST_OK_AT updates within ~25h of the verifier's clean run.
# workflow_dispatch enabled for manual testing without waiting 24 hours.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  rebuild-nightly-staging:
    name: Nightly rebuild and deploy (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verifier freshness gate
        run: |
          set -euo pipefail
          LAST_OK="${{ vars.VERIFIER_LAST_OK_AT }}"
          if [ -z "$LAST_OK" ]; then
            echo "::error::VERIFIER_LAST_OK_AT repo variable is unset. Run the verifier or set the variable manually."
            exit 1
          fi
          LAST_OK_TS=$(date -d "$LAST_OK" +%s 2>/dev/null || python3 -c "import datetime, sys; print(int(datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00')).timestamp()))" "$LAST_OK")
          NOW_TS=$(date -u +%s)
          AGE_DAYS=$(( (NOW_TS - LAST_OK_TS) / 86400 ))
          if [ "$AGE_DAYS" -gt 90 ]; then
            echo "::error::Verifier last clean run was $AGE_DAYS days ago (variable: $LAST_OK). Investigate verifier health before deploying."
            exit 1
          fi
          echo "[workflow] verifier freshness OK ($AGE_DAYS days since last clean run)"

      - name: Build for staging
        env:
          PUBLIC_ENVIRONMENT: staging
          PRODUCT_REPOS_PAT: ${{ secrets.PRODUCT_REPOS_PAT }}
          PUBLIC_CWA_TOKEN: ${{ secrets.PUBLIC_CWA_TOKEN }}
          VERIFIED_AT: ${{ vars.VERIFIER_LAST_OK_AT }}
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env staging
