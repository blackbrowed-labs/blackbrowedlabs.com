name: verify-cloudflare-facts

# Weekly Cloudflare-fact verifier — three-channel alert model
# (g-d-10/plan.md G D.11.1).
#
# Runs scripts/run-verifier.mjs against the published DPF list and
# Cloudflare's CWA data-retention page. The orchestrator surfaces three
# independent flags via $GITHUB_OUTPUT — `all_ok`, `has_value_diff`,
# `has_failure` — each gating its own channel:
#   - all_ok          → updates the VERIFIER_LAST_OK_AT repo variable.
#                       No PR, no Issue (silent-when-healthy).
#   - has_value_diff  → opens a PR on `dev` with the value diff.
#   - has_failure     → opens a verifier-alert Issue.
# Channels are independent — a single run can fire >1 (e.g. CWA changed
# AND DPF unreachable).
#
# Cron: Monday 02:00 UTC weekly. Workflow timeout: 30 min — comfortably
# absorbs the 1/5/15-min retry budget.

on:
  schedule:
    - cron: "0 2 * * 1"  # Monday 02:00 UTC weekly
  workflow_dispatch:
    inputs:
      mock_scenario:
        description: "Mock scenario for testing (e.g. 'dpf-absent', 'cwa-changed-figure'). When set, runs --dry-run with the matching fixture."
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Note: the VERIFIER_LAST_OK_AT variable update uses a separate
  # fine-grained PAT (secret VERIFIER_VARIABLE_TOKEN) — GITHUB_TOKEN
  # with `actions: write` is not sufficient for the Actions Variables
  # API (HTTP 403 on PATCH). See G D.10/11 fix-up commit.

jobs:
  verify:
    name: Run verifier checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verifier
        id: run
        env:
          MOCK_SCENARIO: ${{ github.event.inputs.mock_scenario }}
        run: |
          set -e
          if [ -n "$MOCK_SCENARIO" ]; then
            echo "[workflow] dispatch mock_scenario=$MOCK_SCENARIO; running --dry-run"
            node scripts/run-verifier.mjs --dry-run
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            # In dry-run the orchestrator does not advance GH outputs that
            # gate live channel steps; explicitly pin all three flags to
            # false so the variable-update, PR, and Issue gates are skipped.
            echo "all_ok=false" >> "$GITHUB_OUTPUT"
            echo "has_value_diff=false" >> "$GITHUB_OUTPUT"
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/run-verifier.mjs
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

      - name: Update VERIFIER_LAST_OK_AT (clean run only)
        if: ${{ steps.run.outputs.all_ok == 'true' && steps.run.outputs.dry_run == 'false' }}
        env:
          # Fine-grained PAT with Variables: read/write on this repo
          # only. GITHUB_TOKEN with `actions: write` returns HTTP 403
          # on the Actions Variables API; the workflow-permissions YAML
          # does not expose a `variables` scope.
          GH_TOKEN: ${{ secrets.VERIFIER_VARIABLE_TOKEN }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "[workflow] updating VERIFIER_LAST_OK_AT to $NOW"
          gh api -X PATCH \
            "/repos/${{ github.repository }}/actions/variables/VERIFIER_LAST_OK_AT" \
            -f name=VERIFIER_LAST_OK_AT -f value="$NOW"

      - name: Open auto-PR for value change
        if: ${{ steps.run.outputs.has_value_diff == 'true' && steps.run.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE_TAG=$(date -u +%Y-%m-%d)
          BRANCH="verifier/cloudflare-facts-${DATE_TAG}"
          git config user.name "verifier-bot"
          git config user.email "verifier@blackbrowedlabs.com"
          git checkout -b "$BRANCH"
          git add src/data/cloudflare-facts.json
          git commit -m "chore(verifier): refresh cloudflare-facts.json (${DATE_TAG})"
          git push origin "$BRANCH"
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore(verifier): cloudflare-facts value change (${DATE_TAG})" \
            --body "Automated PR from verify-cloudflare-facts.yml — at least one verified fact changed or went absent at the upstream source. Review the diff; the privacy pages render this data verbatim. The BASELINE prose in docs/BASELINE_COPY.md may need a paired update."

      - name: Open verifier-alert Issue on failure
        if: ${{ steps.run.outputs.has_failure == 'true' && steps.run.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCH_EVENT: ${{ github.event_name }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          DATE_TAG=$(date -u +%Y-%m-%d)
          # Build the Issue body with printf — avoids the bash-heredoc /
          # YAML-block-scalar interaction that the reviewer flagged in
          # G D.7 (MAJOR 1). printf with explicit \n separators sidesteps
          # the "column 0" question entirely: each argument is one line,
          # the result is plain markdown, and the YAML stays valid.
          BODY=$(printf '%s\n' \
            "The Cloudflare-fact verifier could not complete one or more checks." \
            "" \
            "- Run logs: ${RUN_URL}" \
            "- Triggered by: ${DISPATCH_EVENT}" \
            "- Branch checked: dev" \
            "" \
            "## Recommended action" \
            "" \
            "1. Open the run logs above; identify which check failed and the status (parser-broken / unreachable)." \
            "2. If parser-broken: inspect the source URL; update the regex in scripts/checks/<fact>.mjs (or refresh fixtures if upstream restructured)." \
            "3. If unreachable: confirm the source URL is up; if transient, re-run the workflow.")
          gh issue create \
            --title "[verifier] Cloudflare-facts check could not complete (${DATE_TAG})" \
            --body "$BODY" \
            --label "verifier-alert" \
            --assignee "$ASSIGNEE"

      - name: Stale verifier-alert escalation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Stale-Issue + stale-PR escalation per spec §7.4: 14 / 30 / 60
          # day comment cadence. Marker-comment idempotency: each
          # threshold's comment carries a hidden marker
          # (<!-- verifier-stale-Nd -->), and we skip posting when the
          # marker is already present on that target — so a 6-week-stale
          # Issue accumulates 14d + 30d comments once each, not weekly.
          # Best-effort: if any single target errors, the loop continues.
          REPO="${{ github.repository }}"

          post_if_new () {
            # post_if_new <target-kind: issue|pr> <number> <threshold-days> <body>
            local kind="$1" num="$2" days="$3" body="$4"
            local marker="<!-- verifier-stale-${days}d -->"
            local existing
            existing=$(gh api "repos/${REPO}/issues/${num}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null || echo "")
            if [ -n "$existing" ]; then
              echo "[workflow] ${kind} #${num}: ${days}d marker already present, skipping"
              return 0
            fi
            local payload="${marker}"$'\n\n'"${body}"
            if [ "$kind" = "pr" ]; then
              gh pr comment "$num" --body "$payload" || true
            else
              gh issue comment "$num" --body "$payload" || true
            fi
          }

          escalate () {
            # escalate <target-kind: issue|pr> <number> <created_at>
            local kind="$1" num="$2" created="$3"
            local created_ts now_ts age
            created_ts=$(date -u -d "$created" +%s 2>/dev/null || echo "")
            if [ -z "$created_ts" ]; then
              echo "[workflow] could not parse createdAt for ${kind} #${num}; skipping"
              return 0
            fi
            now_ts=$(date -u +%s)
            age=$(( (now_ts - created_ts) / 86400 ))
            if [ "$age" -ge 60 ]; then
              post_if_new "$kind" "$num" 60 "Stale verifier alert — open for $age days. Class-of-failure: review whether the verifier design needs adjustment."
            fi
            if [ "$age" -ge 30 ]; then
              post_if_new "$kind" "$num" 30 "Stale verifier alert — open for $age days. The privacy-page verified_at field has been stale for the same duration."
            fi
            if [ "$age" -ge 14 ]; then
              post_if_new "$kind" "$num" 14 "Stale verifier alert — open for $age days."
            fi
          }

          # Issues
          gh issue list --label "verifier-alert" --state open --json number,createdAt --jq '.[] | "\(.number) \(.createdAt)"' | while read -r num created; do
            [ -z "$num" ] && continue
            escalate "issue" "$num" "$created"
          done

          # Auto-PRs from the verifier/ branch namespace (spec §3.7 mode #7).
          gh pr list --base dev --state open --json number,headRefName,createdAt --jq '.[] | select(.headRefName | startswith("verifier/")) | "\(.number) \(.createdAt)"' | while read -r num created; do
            [ -z "$num" ] && continue
            escalate "pr" "$num" "$created"
          done
